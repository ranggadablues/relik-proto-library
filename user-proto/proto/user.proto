// Use proto3 syntax for modern features and Go-friendly code generation.
syntax = "proto3";

package user.v1;

// Set the Go package path for the generated code.
// The `pb` is a common convention for protobuf packages.
option go_package = ".;pb";

// Import a well-known type for timestamps.
// This is a standard way to handle date/time values in Protobuf.
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// ✅ Swagger configuration
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "User Service API"
    version: "1.0"
    description: "This service handles user management."
  }
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT Authorization header using the Bearer scheme."
      }
    }
  }
};

// The core data model for a User.
// Field numbers (1, 2, 3...) are unique identifiers and should never be changed.
message User {
  string id = 1; // ObjectID as hex string
  string email = 2;
  bool isactive = 3;
  string createdsource = 4;
  repeated string userdetailsids = 5;

  string createby = 7;
  google.protobuf.Timestamp createdat = 8;
  string updateby = 9;
  google.protobuf.Timestamp updatedat = 10;
}

message UserDetails {
  string id = 1; // ObjectID as hex string
  bool isdefault = 2;
  string name = 3;
  string password = 4;
  string confirmpassword = 5;
  string gender = 6;
  string address = 7;
  string zipcode = 8;
  string phone = 9;
  string city = 10;
  string state = 11;
  string country = 12;
  string dob = 13;
  bool termofserviceandprivacypolicy = 14;
  bool subscribenewsletter = 15;
  
  string createby = 16;
  google.protobuf.Timestamp createdat = 17;
  string updateby = 18;
  google.protobuf.Timestamp updatedat = 19;
}

// Request message for creating a new user.
// We include the raw password here as it will be hashed by the server.
message CreateUserRequest {
  User user = 1;
  UserDetails userdetails = 2;
}

// Response message after a user is created.
// It returns the newly created User object.
message CreateUserResponse {
  User user = 1;
}

message CreateBasicUserResponse {
  string link = 1;
}

// Request message for getting a user by their ID.
message GetUserByIdRequest {
  string id = 1;
  string token = 2;
}

// Response message for getting a user.
message GetUserByIdResponse {
  User user = 1;
}

// Request message for updating an existing user.
// We use a separate message to allow for partial updates.
// For example, if you only want to update the email, you don't
// need to send the other fields.
message UpdateUserRequest {
  string id = 1; // ObjectID as hex string
  UserUpdate user = 2; // this will go in the JSON body
}

message UserUpdate {
  string email = 1;
  string password = 2;
  string accesskey = 3;
  string updatedby = 4;
  google.protobuf.Timestamp updatedat = 5;
  bool isactive = 6;
  string createdsource = 7;
  string userdetailsid = 8;
}

// Response message after a user is updated.
message UpdateUserResponse {
  bool success = 1;
}

// Request message for list users.
message ListUsersRequest {}

// Response message for list users.
message ListUsersResponse {
  repeated User users = 1;
}

// Request message for delete user.
message DeleteUserRequest {
  string id = 1; // ObjectID as hex string
}

// Response message for list users.
message DeleteUserResponse {
  bool success = 1;
}

message userActionRequest {
  string id = 1; // ObjectID as hex string
  string email = 2;
  string password = 3;
  string accesskey = 4;
  bool isactive = 5;
  string module = 6;
}

message UserActionResponse {
  oneof result {
    LoginResponse login = 1;
    CreateUserResponse register = 2;
  }
}

message RefreshRequest {
  string refreshToken = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string refreshToken = 2;   // refresh token
}

message Empty {}

message AuthResponse {
  string userid = 1;
  string email = 2;
  string role = 3;
}

message UserVerificationRequest {
  string token = 1;
  string module = 2;
}

message UserVerificationResponse {
  bool success = 1;
}

// Defines the gRPC service with the RPC methods.
service UserService {
  // Protected endpoints (JWT required)
  // Gets a user by their unique ID.
  rpc GetUserById (GetUserByIdRequest) returns (GetUserByIdResponse) {
    option (google.api.http) = {
      get: "/users/{id}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get user by ID";
      description: "Requires JWT authentication.";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        }
      }
    };
  }

  // Updates an existing user's information.
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      put: "/users/{id}"
      body: "user"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update user";
      description: "Requires JWT authentication.";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        }
      }
    };
  }

  // List users.
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/users"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List users";
      description: "Requires JWT authentication.";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        }
      }
    };
  }

  // Delete user
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/users/{id}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete user";
      description: "Requires JWT authentication.";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        }
      }
    };
  }

  // Create/Register user
  rpc CreateUser (CreateUserRequest) returns (CreateBasicUserResponse) {
    option (google.api.http) = {
      post: "/users/register"
      body: "*"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create/Register user";
      description: "Requires JWT authentication.";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        }
      }
    };
  }

  // Get user by JWT
  rpc GetUser (Empty) returns (AuthResponse) {
    option (google.api.http) = {
      get: "/users/me"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Retrieve the currently authenticated user's data";
      security: {
        security_requirement: { key: "BearerAuth"; value: {}; }
      };
    };
  }

  // Public endpoints (no JWT)
  // Login user
  rpc LoginUser (LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/users/login"
      body: "*"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "User login (no authentication)";
    };
  }

  // Refresh token
  rpc RefreshToken (RefreshRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/refresh"
    };
  }

  // User Verification
  rpc UserVerification (UserVerificationRequest) returns (UserVerificationResponse) {
    option (google.api.http) = {
      get: "/users/verify/{token}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "User Activation Verification (no authentication)";
    };
  }
}

message NotificationIntegrationsRequest {
  string id = 1;
}

message NotificationIntegrations {
  string id = 1;
  string type = 2;
  string provider = 3;
  string sendername = 4;
  string senderemail = 5;

  // oauth
  string clientid = 6;
  string clientsecret = 7;
  string refreshtoken = 8;
  string redirecturl = 9;
  repeated string scopes = 10;

  // smtp
  string smtphost = 11;
  int32 smtpport = 12;
  string smtpusername = 13;
  string smtppassword = 14;

  string createby = 15;
  google.protobuf.Timestamp createdat = 16;
  string updateby = 17;
  google.protobuf.Timestamp updatedat = 18;
}

message NotificationEventsRequest {
  string id = 1;
  string name = 2;
}

message NotificationEvents {
  string id = 1;
  string type = 2;
  string name = 3;
  string subject = 4;
  string body = 5;
  string createby = 6;
  google.protobuf.Timestamp createdat = 7;
  string updateby = 8;
  google.protobuf.Timestamp updatedat = 9;
}

service NotificationService {
  // Gets a notification integration by their unique ID or provider.
  rpc GetNotificationIntegrationsById (NotificationIntegrationsRequest) returns (NotificationIntegrations) {
    option (google.api.http) = {
      get: "/notification/integrations/{id}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Notification Integrations by ID";
      description: "Requires JWT authentication.";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        }
      }
    };
  }

  rpc GetNotificationEventsById (NotificationEventsRequest) returns (NotificationEvents) {
    option (google.api.http) = {
      get: "/notification/events/{id}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Notification Events by ID";
      description: "Requires JWT authentication.";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        }
      }
    };
  }
}