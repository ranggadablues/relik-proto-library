syntax = "proto3";

package relik.notification.v1;

option go_package = "github.com/ranggadablues/relik-proto-library/gen/go/relik/notification/v1;notificationv1";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// ✅ Swagger configuration
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Notification Service API"
    version: "1.0"
    description: "This service handles notification integrations and events."
  }
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT Authorization header using the Bearer scheme."
      }
    }
  }
};

message NotificationIntegration {
  string id = 1;
  string type = 2;
  string provider = 3;
  string sender_name = 4;
  string sender_email = 5;

  // OAuth
  string client_id = 6;
  string client_secret = 7;
  string refresh_token = 8;
  string redirect_url = 9;
  repeated string scopes = 10;

  // SMTP
  string smtp_host = 11;
  int32 smtp_port = 12;
  string smtp_username = 13;
  string smtp_password = 14;

  string created_by = 15;
  google.protobuf.Timestamp created_at = 16;
  string updated_by = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message NotificationEvent {
  string id = 1;
  string type = 2;
  string name = 3;
  string subject = 4;
  string body = 5;

  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  string updated_by = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GetNotificationIntegrationsByIdRequest {
  string id = 1;
}

message GetNotificationIntegrationsByIdResponse {
  NotificationIntegration integration = 1;
}

message GetNotificationEventsByIdRequest {
  string id = 1;
}

message GetNotificationEventsByIdResponse {
  NotificationEvent event = 1;
}

message GetNotificationEventsByNameRequest {
  string name = 1;
}

message GetNotificationEventsByNameResponse {
  NotificationEvent event = 1;
}

service NotificationService {
  // Gets a notification integration by ID.
  rpc GetNotificationIntegrationsById (GetNotificationIntegrationsByIdRequest) returns (GetNotificationIntegrationsByIdResponse) {
    option (google.api.http) = {
      get: "/notification/integrations/{id}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Notification Integration by ID";
      description: "Requires JWT authentication.";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        }
      }
    };
  }

  // Gets a notification event by ID.
  rpc GetNotificationEventsById (GetNotificationEventsByIdRequest) returns (GetNotificationEventsByIdResponse) {
    option (google.api.http) = {
      get: "/notification/events/{id}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Notification Event by ID";
      description: "Requires JWT authentication.";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        }
      }
    };
  }

  // Gets a notification event by Name.
  rpc GetNotificationEventsByName (GetNotificationEventsByNameRequest) returns (GetNotificationEventsByNameResponse) {
    option (google.api.http) = {
      get: "/notification/events/name/{name}"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Notification Event by Name";
      description: "Requires JWT authentication.";
      security: {
        security_requirement: {
          key: "BearerAuth";
          value: {};
        }
      }
    };
  }
}

